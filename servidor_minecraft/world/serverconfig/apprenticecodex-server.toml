[Blocks]

	#Entries for spellCraftBlacklist use "modid:spell_id" (example: "irons_spellbooks:black_hole").
	[Blocks.ApprenticeDesk]
		disableNonJobSiteFeatures = false
		enableSpellCraftBlacklist = false
		spellCraftBlacklist = []
		requireSameSchool = false
		disableCommonRarityConversion = false

	#20 ticks = 1 second. Default = 1 minute.
	[Blocks.ArcanumInAJar]
		#Range: > 1
		ticksPerStoredParameter = 3600

	[Blocks.SpellDispenser]
		#Enables Spell Dispenser redstone and contraption casting.
		enable = true
		#Enables the server-side Spell Dispenser spell allowlist.
		#When enabled, an empty spellAllowlist blocks all spells.
		enableSpellAllowlist = false
		#Namespaced spell IDs that Spell Dispenser may cast when enableSpellAllowlist is true.
		spellAllowlist = []
		#Multiplier applied to Spell Dispenser cooldown ticks. Minimum is 0.1.
		#Range: 0.1 ~ 1.7976931348623157E308
		cooldownMultiplier = 1.0
		#Enables mana consumption for Creative Spell Dispenser. Disabled by default.
		creativeManaConsumption = false
		#Multiplier applied to Creative Spell Dispenser cooldown ticks.
		#WARNING: Setting this to 0 can cause catastrophic server load if redstone or contraptions repeatedly cast spells.
		#Range: 0.0 ~ 1.7976931348623157E308
		creativeCooldownMultiplier = 0.1

